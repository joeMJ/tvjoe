# Empfangsquelle: Digital Devices Octopus NET (SAT>IP; je nach Bestückung Satellit, Antenne
# oder Kabel). Beschreibung nach der SAT>IP-Norm, Eigenheiten des Geräts unbekannt; ungetestet.
id = "octopus-net"
name = "Digital Devices Octopus NET"
driver = "satip"
systems = ["dvbs", "dvbs2", "dvbt", "dvbt2", "dvbc"]
tuners = 4
signal_epg = true

[satellite]
name = "Astra 19,2° Ost"
orbital = 192
east = true
# Starttransponder des Suchlaufs (sendet die Netzwerktabelle mit allen Transpondern).
seed = { freq = 11494, pol = "h", dvbs2 = true, mtype = "8psk", sr = 22000, fec = "23" }
