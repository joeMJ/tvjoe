# Empfangsquelle: Kathrein EXIP 414/418 (SAT>IP, Satellit). Beschreibung nach der SAT>IP-Norm,
# Eigenheiten des Geräts unbekannt; ungetestet.
class = "television"
id = "kathrein-exip"
name = "Kathrein EXIP"
driver = "satip"
systems = ["dvbs", "dvbs2"]
tuners = 4
signal_epg = true

[satellite]
name = "Astra 19,2° Ost"
orbital = 192
east = true
# Starttransponder des Suchlaufs (sendet die Netzwerktabelle mit allen Transpondern).
seed = { freq = 11494, pol = "h", dvbs2 = true, mtype = "8psk", sr = 22000, fec = "23" }
