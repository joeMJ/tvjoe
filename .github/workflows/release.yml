# Baut bei einem Versionsschild v… die .deb-Pakete für Ubuntu 24.04 und 26.04 und legt ein
# Release mit tvjoe_<version>_<distro>_amd64.deb und einer gemeinsamen SHA256SUMS an
# (Namensschema der Updatefunktion und von install.sh).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu2404:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Systempakete
        timeout-minutes: 30
        run: |
          # Auslöser von man-db abschalten: auf den GitHub-Rechnern dauert er sonst sehr lange.
          sudo rm -f /var/lib/man-db/auto-update
          # Paketspiegel: archive.ubuntu.com zuerst, der Azure-Spiegel der GitHub-Rechner nur
          # noch als Ausweich (er hing bei 0.0.15, 0.0.17 und 0.1.2).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\tpriority:1\n%s\tpriority:2\n%s\tpriority:3\n' \
              http://archive.ubuntu.com/ubuntu/ \
              http://azure.archive.ubuntu.com/ubuntu/ \
              http://security.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
          fi
          # Hängt apt (Paketspiegel), nach einigen Minuten abbrechen und neu versuchen.
          for i in 1 2 3; do
            if sudo timeout 300 apt-get update \
              && sudo timeout 480 apt-get install -y \
                libgtk-4-dev libadwaita-1-dev libmpv-dev pkg-config; then
              exit 0
            fi
            echo "Systempakete: Versuch $i fehlgeschlagen, neuer Versuch"
            sudo dpkg --configure -a || true
            sleep 20
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --locked -p tvjoe-core
      - name: Paket bauen
        run: tools/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu24.04
          path: target/deb/*.deb

  ubuntu2604:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Systempakete
        timeout-minutes: 30
        run: |
          for i in 1 2 3; do
            if timeout 300 apt-get update \
              && timeout 480 apt-get install -y ca-certificates curl git build-essential \
                pkg-config dpkg-dev libgtk-4-dev libadwaita-1-dev libmpv-dev; then
              exit 0
            fi
            echo "Systempakete: Versuch $i fehlgeschlagen, neuer Versuch"
            dpkg --configure -a || true
            sleep 20
          done
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --locked -p tvjoe-core
      - name: Paket bauen
        run: tools/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu26.04
          path: target/deb/*.deb

  release:
    needs: [ubuntu2404, ubuntu2604]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Prüfsummen
        run: cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
