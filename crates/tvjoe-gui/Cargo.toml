[package]
name = "tvjoe-gui"
description = "tvjoe: Oberfläche (GTK4/libadwaita) mit libmpv-Wiedergabe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tvjoe-core = { path = "../tvjoe-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
libmpv2 = "6"
libmpv2-sys = "4"
libloading = "0.9"
async-channel = "2"
libc = "0.2"
